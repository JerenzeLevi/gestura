<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gestura">
  <title>Gestura</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".55" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0d16"/>
  <!-- Signal arcs: the camera reading the pose. -->
  <g fill="none" stroke="#f5c451" stroke-linecap="round">
    <path d="M14 25a12 12 0 0 1 0 14" stroke-width="3" opacity=".65"/>
    <path d="M7.5 19a21 21 0 0 1 0 26" stroke-width="2.5" opacity=".35"/>
  </g>
  <!-- Boxing glove: thumb, body, cuff. -->
  <circle cx="26" cy="35" r="6.5" fill="url(#gold)"/>
  <rect x="29" y="15" width="24" height="34" rx="11" fill="url(#gold)"/>
  <rect x="29" y="38" width="24" height="3.5" fill="#0b0d16" opacity=".32"/>
</svg>
